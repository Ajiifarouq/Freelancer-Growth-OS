name: Governance and Repository Safety

on:
  pull_request:
  push:
    branches:
      - main
      - "hardening/**"

permissions:
  contents: read

jobs:
  governance-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Run governance regression self-tests
        run: python .github/scripts/governance_check.py --self-test

      - name: Run repository governance checks
        run: python .github/scripts/governance_check.py
